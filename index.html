<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台世界引擎</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; }
  #frames { position: relative; width: 100%; height: 100%; }
  #frames iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #f4efe6;
    visibility: hidden; pointer-events: none; z-index: 0;
  }
  #frames iframe.is-on { visibility: visible; pointer-events: auto; z-index: 2; }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 28px;
    color: #695d50; background: #f4efe6; text-align: center;
    font: 14px/1.7 "Microsoft YaHei", sans-serif;
  }
  #status[hidden] { display: none; }
  #status strong { display: block; margin-bottom: 6px; color: #39322c; font-size: 17px; }
  #status small { display: block; max-width: 620px; color: #8b7c6d; }
</style>
</head>
<body>
<div id="status"><div><strong>正在连接异步助手数据…</strong><small>等待后台世界引擎结构化视图。</small></div></div>
<div id="frames" hidden></div>
<script>
/**
 * 静态站单入口：四页仍是独立 HTML（方便截图/体检工具），对外只暴露一个 URL。
 * 路由：#/overview | #/characters | #/factions | #/tasks
 * 子页通过 window.parent.WE_SPA.navigate 或 postMessage({type:'we-goto'}) 切页。
 *
 * 切页保活：每个路由一个 iframe，显隐切换，不重复拆文档。
 * 数据更新：改 WE_WORLD_DATA 后 postMessage we-world-refresh，子页就地重绘。
 */
(function () {
  'use strict';

  const ROUTES = {
    overview: '总览.html',
    characters: '角色档案.html',
    factions: '势力与地区.html',
    tasks: '任务与事件.html',
  };
  const DEFAULT = 'overview';
  const VIEW_ID = 'bg_world_structured_v09';
  const WATCH_ID = 'bg-world-panel';
  const bridgeEnabled = new URLSearchParams(location.search).get('acuBridge') === '1';
  const framesRoot = document.getElementById('frames');
  const status = document.getElementById('status');
  const frames = Object.create(null);
  let current = '';
  let pending = '';
  let hasData = false;
  let bridgeTimer = 0;
  let prefetchStarted = false;

  function setStatus(title, detail) {
    status.innerHTML = '<div><strong>' + title + '</strong><small>' + (detail || '') + '</small></div>';
    status.hidden = false;
    framesRoot.hidden = true;
  }

  function extractWorld(result) {
    const data = result && result.data;
    const world = data && data.background_world;
    if (!world || typeof world !== 'object') throw new Error('视图缺少 data.background_world');

    const sections = ['world', 'changes', 'npcs', 'factions', 'candidates', 'tasks', 'events', 'regions', 'exclusions'];
    for (const key of sections) if (!Array.isArray(world[key])) world[key] = [];

    // 结构化视图必须保留原始英文键；中文 alias 会让现有页面所有字段失配。
    const meta = world.world[0];
    if (meta && !Object.prototype.hasOwnProperty.call(meta, 'world_time')
      && Object.prototype.hasOwnProperty.call(meta, '当前世界时间')) {
      throw new Error('bg_world_structured_v09 仍在输出中文字段别名');
    }
    return world;
  }

  // 演进面板业务：副 AI 从零 add /npc 时，用 AcuData.applyPatches 改写到候选。
  // 用户晋升也走 applyPatches，source 是 acu-data，不会进这里。橱窗壳只转发事件，不认人。
  let pendingAiNpcNames = null;

  function listOf(world, key) {
    return Array.isArray(world && world[key]) ? world[key] : [];
  }

  function npcToCandidate(p) {
    return {
      name: p.name,
      status: 'observe',
      updated_at: p.updated_at || '',
      next_update: p.next_update || '',
      profile: p.profile || {},
      current_state: p.current_state || {},
      schedule: Array.isArray(p.schedule) ? p.schedule : [],
      conditions: Array.isArray(p.conditions) ? p.conditions : [],
      relations: Array.isArray(p.relations) ? p.relations : [],
      decisions: Array.isArray(p.decisions) ? p.decisions : [],
      observations: Array.isArray(p.observations) ? p.observations : [],
      retention: {
        status_basis: 'AI 误写入固定人物，已改回候选',
        missing_evidence: '',
        next_observation: p.next_update || '',
      },
    };
  }

  function markAiOutput(change) {
    if (!change || change.source !== 'unit-output') return;
    pendingAiNpcNames = new Set(listOf(window.WE_WORLD_DATA, 'npcs').map(function (item) {
      return item && item.name;
    }).filter(Boolean));
  }

  function takeAiAddedNpcs(world) {
    const before = pendingAiNpcNames;
    pendingAiNpcNames = null;
    if (!before) return [];
    const excluded = new Set(
      listOf(world, 'exclusions')
        .filter(function (item) { return item && item.kind === 'person' && item.name; })
        .map(function (item) { return item.name; }),
    );
    return listOf(world, 'npcs').filter(function (npc) {
      return npc && npc.name && !before.has(npc.name);
    }).map(function (npc) {
      return { npc: npc, excluded: excluded.has(npc.name) };
    });
  }

  function applyAiNpcMovesLocally(world, added) {
    const patches = [];
    added.forEach(function (item) {
      const name = item.npc.name;
      world.npcs = listOf(world, 'npcs').filter(function (row) { return !row || row.name !== name; });
      patches.push({ op: 'delete', table: 'bg_fixed_npc_state', primaryKey: name });
      if (item.excluded) return;
      const row = npcToCandidate(item.npc);
      world.candidates = listOf(world, 'candidates').filter(function (c) { return !c || c.name !== name; }).concat([row]);
      patches.push({ op: 'write', table: 'bg_candidate_state', primaryKey: name, values: row });
    });
    return patches;
  }

  function acceptData(result) {
    const world = extractWorld(result);
    const added = takeAiAddedNpcs(world);
    const patches = added.length ? applyAiNpcMovesLocally(world, added) : [];
    window.WE_WORLD_DATA = world;
    const first = !hasData;
    hasData = true;
    clearTimeout(bridgeTimer);
    status.hidden = true;
    framesRoot.hidden = false;
    if (first) sync(false);
    else broadcastRefresh();
    if (patches.length) applyPatches(patches).catch(function (err) {
      console.warn('[world-view] 将 AI 新增人物改回候选失败', err);
    });
  }

  function startBridge() {
    if (!bridgeEnabled || window.parent === window) {
      setStatus(
        '需要从异步助手橱窗打开',
        '此站点不再包含示例数据。请导入配套配置方案，然后在异步助手的“橱窗”中打开。',
      );
      return;
    }
    bridgeTimer = setTimeout(function () {
      if (!hasData) setStatus(
        '未收到后台世界数据',
        '请确认当前方案包含 bg_world_structured_v09，且异步助手数据库桥已加载。',
      );
    }, 8000);
    window.parent.postMessage({
      type: 'we-watch-view',
      watchId: WATCH_ID,
      viewId: VIEW_ID,
      params: {},
      options: {},
    }, '*');
    window.parent.postMessage({
      type: 'we-subscribe',
      subscribeId: WATCH_ID + '-changes',
      filter: {},
    }, '*');
  }

  function parseRoute() {
    const raw = String(location.hash || '').replace(/^#\/?/, '').trim();
    const id = raw.split(/[?#]/)[0] || DEFAULT;
    return ROUTES[id] ? id : DEFAULT;
  }

  function navigate(id, opts) {
    const route = ROUTES[id] ? id : DEFAULT;
    if (opts && opts.focus != null) {
      try { sessionStorage.setItem('focusTask', String(opts.focus)); } catch (_e) { /* ignore */ }
    }
    const next = '#/' + route;
    if (location.hash === next) sync(true);
    else location.hash = next;
  }

  function frameUrl(id) {
    return new URL(ROUTES[id], location.href).href;
  }

  function ensureFrame(id) {
    if (frames[id]) return frames[id];
    const el = document.createElement('iframe');
    el.title = id;
    el.dataset.route = id;
    framesRoot.appendChild(el);
    frames[id] = el;
    return el;
  }

  function reveal(id) {
    current = id;
    Object.keys(ROUTES).forEach(function (rid) {
      const el = frames[rid];
      if (el) el.classList.toggle('is-on', rid === id);
    });
  }

  function postToFrame(id, payload) {
    const el = frames[id];
    if (!el || !el.contentWindow || el.dataset.ready !== '1') return;
    try { el.contentWindow.postMessage(payload, '*'); } catch (_e) { /* ignore */ }
  }

  function loadFrame(id, thenReveal) {
    const el = ensureFrame(id);
    if (el.dataset.ready === '1' && el.getAttribute('src')) {
      if (thenReveal) reveal(id);
      return;
    }
    if (el.getAttribute('src') && el.dataset.loading === '1') {
      if (thenReveal) el.dataset.reveal = '1';
      return;
    }
    el.dataset.loading = '1';
    if (thenReveal) el.dataset.reveal = '1';
    el.addEventListener('load', function () {
      el.dataset.ready = '1';
      el.dataset.loading = '';
      if (el.dataset.reveal === '1' && pending === id) reveal(id);
      el.dataset.reveal = '';
    }, { once: true });
    el.src = frameUrl(id);
  }

  function prefetchRest(except) {
    if (prefetchStarted) return;
    prefetchStarted = true;
    const rest = Object.keys(ROUTES).filter(function (id) { return id !== except; });
    let i = 0;
    function next() {
      if (i >= rest.length) return;
      loadFrame(rest[i++], false);
      setTimeout(next, 80);
    }
    if (typeof requestIdleCallback === 'function') {
      requestIdleCallback(next, { timeout: 600 });
    } else {
      setTimeout(next, 200);
    }
  }

  function showRoute(id) {
    pending = id;
    const el = ensureFrame(id);
    if (el.dataset.ready === '1') {
      reveal(id);
      prefetchRest(id);
      return;
    }
    loadFrame(id, true);
    prefetchRest(id);
  }

  function broadcastRefresh() {
    Object.keys(frames).forEach(function (id) {
      postToFrame(id, { type: 'we-world-refresh' });
    });
  }

  function sync(force) {
    if (!hasData) return;
    const id = parseRoute();
    showRoute(id);
    let focus = '';
    try { focus = sessionStorage.getItem('focusTask') || ''; } catch (_e) { focus = ''; }
    if (!focus) return;
    const send = function () { postToFrame(id, { type: 'we-focus', name: focus }); };
    const el = frames[id];
    if (el && el.dataset.ready === '1') send();
    else if (el) el.addEventListener('load', send, { once: true });
  }

  window.WE_SPA = { navigate: navigate, routes: ROUTES, applyPatches: applyPatches };

  let patchSeq = 0;
  const patchPending = Object.create(null);

  function applyPatches(patches) {
    return new Promise(function (resolve, reject) {
      const id = 'p' + (++patchSeq);
      patchPending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ type: 'we-apply-patches', id: id, patches: patches || [] }, '*');
      setTimeout(function () {
        if (!patchPending[id]) return;
        delete patchPending[id];
        reject(new Error('写入超时'));
      }, 20000);
    });
  }

  window.addEventListener('message', function (e) {
    const data = e && e.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'we-goto') {
      navigate(data.route, data.opts || {});
      return;
    }
    if (e.source === window.parent && data.type === 'we-apply-patches-result' && data.id && patchPending[data.id]) {
      const pending = patchPending[data.id];
      delete patchPending[data.id];
      if (data.ok) pending.resolve(data.result || { ok: true });
      else pending.reject(new Error(data.error || '写入失败'));
      return;
    }
    if (e.source === window.parent && data.type === 'we-data-changed') {
      markAiOutput(data.change);
      return;
    }
    if (e.source === window.parent && data.type === 'we-watch-view-result') {
      if (!data.ok) {
        setStatus('读取后台世界数据失败', data.error || 'AcuData.watchView 返回错误。');
        return;
      }
      try {
        acceptData(data.result);
      } catch (err) {
        setStatus('后台世界数据格式不匹配', String(err && err.message || err));
      }
    }
  });

  window.addEventListener('hashchange', function () { sync(false); });
  if (!location.hash) history.replaceState(null, '', '#/' + DEFAULT);
  startBridge();
})();
</script>
</body>
</html>
