   地区概览
   ========================================================================== */
/* 通栏之后每页放几个地区不再受配平牵制，纯按"一屏读得完多少"定。
   六个收起的地区行约 540px，接近一屏；再多就得滚着找。 */
const REGION_PAGE=6;
const COND_PAGE=3, CHG_PAGE=3;
const sortedRegions=()=>REGIONS.slice().sort(WTime.byNewest('updated_at'));

function taskLink(name,kind){
  if(!name)return '';
  return '<button class="linkbtn" data-task="'+esc(kind==='task'?name:'')+'" data-name="'+esc(name)+'">'+
    '<svg><use href="#'+(kind==='task'?'i-scroll':'i-bell')+'"/></svg>'+
    (kind==='task'?'关联任务':'关联事件')+'　'+esc(name)+'</button>';
}

/* 地区行的底色一律走 indigo，不再是 hueOf('r:'+名字) 轮转出来的那一档。

   轮转色的本意是「同一个地区在全页永远同一个颜色」，可这一行里被它染上色的是
   六个字段名（地区／控制状态／归属势力／控制稳固度／近期变化）——一行里最多的
   那类字。轮到 rose 的地区，整行字段名连同左边的徽记都是红的，而它的控制状态
   明明是绿色的「单方控制」：颜色在喊出事了，事实是什么都没出。轮到 amber 的
   那行同理，读起来像"待处理"。

   这一行里真正带状态的是控制状态胶囊和稳固度档位条，两者都由 control.status 上色，
   争夺中才是红的。颜色留给它们，字段名退回结构色。地区身份靠徽记和名字认，
   本来也不需要再编一道色。 */
function regionRow(r){
  const hue='indigo';
  const c=r.control||{};
  const chue=CONTROL_HUE[c.status]||'indigo';
  const rank=CONTROL_RANK[c.status]||0;
  const open=rowOpen.has(r.name);
  const cur=curFaction();
  const mine=cur&&(c.primary_faction===cur.name||arr(c.contesting_factions).includes(cur.name)||
                   arr(r.present_factions).includes(cur.name));
  const pf=c.primary_faction?FACTION_BY.get(c.primary_faction):null;
  const conds=arr(r.conditions),present=arr(r.present_factions);
  // 收起态只露最新一条，所以这里必须按架空历法排一次，不能信数组原顺序
  const chgs=arr(r.recent_changes).slice().sort(WTime.byNewest('time'));
  const pg=rowPage.get(r.name)||{c:0,g:0};

  let exp='';
  if(open){
    const cp=Math.max(1,Math.ceil(conds.length/COND_PAGE)),cpi=Math.min(pg.c,cp-1);
    const gp=Math.max(1,Math.ceil(chgs.length/CHG_PAGE)),gpi=Math.min(pg.g,gp-1);
    exp='<div class="rexp h-'+hue+'">'+
      '<div class="rx">'+
      sectionH('i-scales','当前条件',hiddenCount(conds.length,COND_PAGE))+
      (conds.length
        ?'<ul class="facts">'+conds.slice(cpi*COND_PAGE,cpi*COND_PAGE+COND_PAGE).map(x=>{
          const ch2=COND_HUE[x.category]||'purple';
          return '<li class="factit h-'+ch2+'"><span class="ft">'+
            chip(ch2,COND_ICON[x.category]||'i-spark',L('region.condition',x.category))+'</span>'+
            '<b>'+esc(x.fact||'未记录事实')+'</b>'+
            '<small>影响：'+esc(x.impact||'未记录影响')+'</small></li>';
        }).join('')+'</ul>'+
         '<div class="pager" data-pg="c" data-n="'+esc(r.name)+'"></div>'
        :emptyNote('本轮没有记录在案的地区条件'))+
      '</div>'+

      '<div class="rx">'+
      sectionH('i-spark','近期变化',hiddenCount(chgs.length,CHG_PAGE))+
      (chgs.length
        ?'<ul class="facts">'+chgs.slice(gpi*CHG_PAGE,gpi*CHG_PAGE+CHG_PAGE).map(x=>
          '<li class="factit h-'+hue+'"><span class="ft"><span class="tm">'+esc(x.time||'时间未记录')+'</span></span>'+
          '<b>'+esc(x.fact||'未记录变化')+'</b>'+
          (x.related_task||x.related_event
            ?'<span class="linkrow">'+taskLink(x.related_task,'task')+taskLink(x.related_event,'event')+'</span>'
            :'<small>未关联任务或事件</small>')+'</li>').join('')+'</ul>'+
         '<div class="pager" data-pg="g" data-n="'+esc(r.name)+'"></div>'
        :emptyNote('本轮这个地区没有值得展示的变化'))+
      '</div>'+

      '<div class="rx wide">'+
      sectionH('i-people','在场与争夺')+
      '<div style="margin-top:8px">'+
        (present.length
          ?'<div class="linkrow">'+present.map(n=>'<button class="linkbtn" data-fac="'+esc(n)+'">'+
            '<svg><use href="#i-shield"/></svg>'+esc(n)+'</button>').join('')+'</div>'
          :emptyNote('没有记录在场势力'))+
        (arr(c.contesting_factions).length
          ?'<div class="linkrow" style="margin-top:7px">'+arr(c.contesting_factions).map(n=>
            '<button class="linkbtn h-rose" data-fac="'+esc(n)+'"><svg><use href="#i-swords"/></svg>争夺方　'+esc(n)+'</button>').join('')+'</div>'
          :'')+
      '</div>'+
      '<div style="margin-top:12px">'+kvGrid([
        ['i-crown','主要控制势力',c.primary_faction],
        ['i-spark','已推演到',r.updated_at],
        ['i-bell','下次检查',r.next_update]
      ],3)+'</div>'+
      '</div>'+
    '</div>';
  }

  return '<article class="regrow h-'+hue+(mine?' on':'')+'" data-n="'+esc(r.name)+'">'+
    '<button class="rtop" data-open="'+esc(r.name)+'">'+
      '<span class="rsig" title="'+esc(sigilBasis(r))+'">'+sigilInner(r)+'</span>'+
      '<span class="rname">'+fieldKey('i-map','地区')+'<b>'+esc(r.name)+'</b></span>'+
      '<span class="rcell">'+fieldKey(CONTROL_ICON[c.status]||'i-ask','控制状态')+
        '<span style="display:block;margin-top:4px">'+chip(chue,'',L('control.status',c.status))+'</span></span>'+
      '<span class="rcell">'+fieldKey('i-crown','归属势力')+
        '<span class="rown h-'+(pf?hueOf('f:'+pf.name):'indigo')+'" style="margin-top:5px">'+
          '<i class="dot"></i><span>'+esc(c.primary_faction||'未记录归属')+'</span></span></span>'+
      /* 档位条把 control.status 的强弱画出来。旧版旁边还写一句「第 3 / 5 档」，
         那只是把亮了几格念了一遍——格子自己数得出来，口径留在 title 里。 */
      '<span class="rcell">'+fieldKey('i-shield','控制稳固度')+
        '<span style="display:block;margin-top:9px">'+
        steps(rank,5,chue,'',
          CONTROL_RANK_NOTE+'；由 control.status 直接推导出的档位，不是评分也不是百分比')+
        '</span></span>'+
      /* 原型这一列叫「近期变化」。收起态只放最新一条，剩下的在展开区里逐条列全，
         所以这里写清"共几条"，让人知道底下还有东西，不是只有这一句。 */
      '<span class="rcell wide">'+fieldKey('i-spark','近期变化')+
        '<span class="rchg">'+(chgs.length
          ? esc(chgs[0].fact||'未记录内容')+(chgs.length>1?'<em>　还有 '+(chgs.length-1)+' 条</em>':'')
          : '<em>本轮无变化记录</em>')+'</span></span>'+
      '<span class="rmore">'+(open?'收起 ⌃':'查看详情 ⌄')+'</span>'+
    '</button>'+exp+
  '</article>';
}

function renderRegions(){
  const all=sortedRegions();
  const pages=Math.max(1,Math.ceil(all.length/REGION_PAGE));
  regionPage=Math.min(regionPage,pages-1);
  const page=all.slice(regionPage*REGION_PAGE,regionPage*REGION_PAGE+REGION_PAGE);
  /* 副标题原来写「共 5 个地区　其中 1 个处于争夺中　按更新时间倒序」——
     总数和排序底下的翻页条已经写着，争夺情况在上面那张图的副标题里。空着。 */
  $('#regionSub').textContent='';

  $('#regions').innerHTML=page.length?page.map(regionRow).join(''):emptyNote('本轮没有地区记录');
  renderPager($('#regionPager'),{page:regionPage,pages,total:all.length,unit:'个地区',
    note:'按更新时间倒序',onGo:n=>{regionPage=n;renderRegions()}});

  // 展开区里两个列表各自的翻页条
  $$('#regions .pager[data-pg]').forEach(el=>{
    const name=el.dataset.n,which=el.dataset.pg;
    const r=REGION_BY.get(name);if(!r)return;
    const list=which==='c'?arr(r.conditions):arr(r.recent_changes);
    const size=which==='c'?COND_PAGE:CHG_PAGE;
    const pgs=Math.max(1,Math.ceil(list.length/size));
    const st=rowPage.get(name)||{c:0,g:0};
    renderPager(el,{page:Math.min(which==='c'?st.c:st.g,pgs-1),pages:pgs,total:list.length,
      unit:which==='c'?'条条件':'条变化',note:'',
      onGo:n=>{const s=rowPage.get(name)||{c:0,g:0};if(which==='c')s.c=n;else s.g=n;rowPage.set(name,s);renderRegions()}});
  });

  $$('#regions .rtop').forEach(el=>el.addEventListener('click',()=>{
    const n=el.dataset.open;
    if(rowOpen.has(n))rowOpen.delete(n);else rowOpen.add(n);
    renderRegions();
  }));
  wireLinks($('#regions'));
}

/** 关联任务／事件按钮跳任务页，势力按钮切换当前势力。两处都会用到。 */
function wireLinks(root){
  $$('.linkbtn[data-name]',root).forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    P.goto('tasks', { focus: el.dataset.name });
  }));
  $$('.linkbtn[data-fac]',root).forEach(el=>el.addEventListener('click',ev=>{
    ev.stopPropagation();
    const i=FACTIONS.findIndex(f=>f.name===el.dataset.fac);
    if(i<0){toast(el.dataset.fac+' 不在本轮势力记录里');return}
    pickNode('f:'+FACTIONS[i].name);
  }));
}

/* =============================================================================
   势力档案（右栏摘要卡）+ 完整档案（宽浮层）

   分工的依据是容器宽度，不是字段重要程度：右栏是 344px 定宽，一份 35 字段的档案
   竖着叠进去就是一根又窄又长的竹竿——原来 1520px，比左栏整个「各地情势」还高。
   原型的右栏本来也不是档案，是一张摘要卡：身份行 / 三个指标 / 资源一横排 /
   外交状态一行一条 / 最近动向两条，每块底下都有个「展开更多」通向别处。

   所以：
     摘要卡  = 是谁、什么状态、手里有什么、跟谁有来往、眼下在忙什么
     完整档案 = 每条记录的全部子字段，1080px 宽表横着铺，不折叠不翻页
   摘要卡里省掉的子字段，浮层里逐个都排出来了（见 renderDossier）。
   ========================================================================== */
const SUM_MAX=4;      // 摘要卡里一节最多几行，超出的写一句"还有 N 条"指向浮层
const slice=(list,size,page)=>{
  const pages=Math.max(1,Math.ceil(list.length/size));
  const p=Math.min(page,pages-1);
  return list.slice(p*size,p*size+size);
};

function renderStance(){
  const f=curFaction();
  const el=$('#stance');
  if(!f){el.innerHTML='<div class="pbody">'+emptyNote('本轮没有势力记录')+'</div>';return}
  const hue=hueOf('f:'+f.name);
  const fh=FACTION_HUE[f.status]||'indigo';
  const focus=f.current_focus||{};
  const areas=arr(f.areas),res=arr(f.resources),grp=arr(f.internal_groups);
  const rel=arr(f.relations),know=arr(f.knowledge),eff=arr(f.visible_effects);
  const defer=arr(focus.deferred_items);

  /* 这里原来挂着一句「共 4 个势力　点选拓扑图上的盾形节点切换」：势力有几个上面
     那张图里摆着，"点哪里能切换"该由光标、悬停抬起和选中的金圈自己说，
     不该写成一行小字教人操作。整行删掉。 */

  // 摘要卡里只放最近两条动向；全部 visible_effects 在浮层和底部「世界动向」里
  const effNew=eff.slice().sort(WTime.byNewest('time'));
  const rest=(n,unit)=>n>SUM_MAX?'<p class="nodata" style="margin-top:7px">还有 '+(n-SUM_MAX)+
    ' '+unit+'在完整档案里</p>':'';

  el.innerHTML=
    '<div class="fhead h-'+hue+'">'+
      '<span class="fcrest" title="'+esc(crestBasis(f))+'">'+crestInner(f)+'</span>'+
      /* 名字底下原来还有一句「纹章按资源构成取图：资金」——那是在解释实现怎么挑的图，
         不是这个势力的情况。留在纹章的 title 里就够了。 */
      '<span class="fmeta"><h3>'+esc(f.name)+chip(fh,FACTION_ICON[f.status]||'i-spark',L('faction.status',f.status))+'</h3></span>'+
    '</div>'+

    /* 名字底下原来是三格概览：「外交关系 2 · 结盟／竞争」「涉足地区 2 · 黑石港／旧港夜市」
       「最深一层 经营」加一条六格档位条，162px。前两格数的和列的，就是这张卡片再往下
       100px 的「对外关系」「地区联系」两节原样摆着的东西；第三格是拿 relation_type
       排出来的档次，看一眼「地区联系」里的 经营／影响 就知道。整块删了。 */
    '<div class="sect h-'+hue+'" style="padding-top:14px">'+
      sectionH('i-flag','当前焦点')+
      '<div style="margin-top:8px">'+
        kvi('i-warn','问题',focus.issue)+
        kvi('i-hand','行动',focus.action)+
        /* 暂缓事项原来是两张带色条的事实卡，一张 41px。它们本来就是短语，
           不是成句的事实陈述，做成胶囊一行能摆两个。 */
        '<div class="kvi" style="margin-top:6px">'+fieldKey('i-hourglass','暂缓')+
          (defer.length
            ?'<span class="chiprow">'+defer.map(d=>chip('amber','',d)).join('')+'</span>'
            :'<span>没有因资源或分歧而暂缓的事项</span>')+'</div>'+
      '</div>'+
    '</div>'+

    /* 资源照原型铺成一横排。子字段（用途 / 限制 / 本轮变化）在浮层里。 */
    '<div class="frule"></div>'+
    '<div class="sect h-'+hue+'">'+
      sectionH('i-coin','资源储备')+
      (res.length
        ?'<div class="rline">'+res.map(x=>{
          const rh=RES_HUE[x.type]||'teal';
          return '<span class="ritem h-'+rh+'" title="'+esc(L('resource.type',x.type)+'：'+(x.quantity||'数量未记录'))+'">'+
            '<svg><use href="#'+(RES_ICON[x.type]||'i-spark')+'"/></svg>'+
            '<b>'+esc(L('resource.type',x.type))+'</b>'+
            '<span>'+esc(x.quantity||'数量未记录')+'</span></span>';
        }).join('')+'</div>'
        :thinNote('本轮没有记录在案的资源'))+
    '</div>'+

    /* 对外关系照原型：一行一条，名字 + 状态胶囊。对象类型看纹章形状（盾／方／圆），
       依据和本轮变化在浮层里。 */
    '<div class="frule"></div>'+
    '<div class="sect h-'+hue+'">'+
      sectionH('i-link','对外关系')+
      (rel.length
        ?'<div style="margin-top:4px">'+rel.slice(0,SUM_MAX).map(r=>{
          const rh=REL_HUE[r.relation_type]||'indigo';
          const t=r.target_type||'other';
          const tf=t==='faction'?FACTION_BY.get(r.target_name):null;
          const tr=t==='region'?REGION_BY.get(r.target_name):null;
          return frow({hue:rh,shape:t==='faction'?'crest':t==='region'?'sq':'rd',
            inner:tf?crestInner(tf):tr?sigilInner(tr):'<svg><use href="#'+(TARGET_ICON[t]||'i-spark')+'"/></svg>',
            name:r.target_name,chips:chip(rh,'',L('relation.type',r.relation_type)),
            title:L('relation.target',t)+'　'+(r.target_name||'')+'　'+L('relation.type',r.relation_type)});
        }).join('')+'</div>'+rest(rel.length,'条关系')
        :thinNote('本轮没有记录在案的对外关系'))+
    '</div>'+

    '<div class="frule"></div>'+
    '<div class="sect h-'+hue+'">'+
      sectionH('i-map','地区联系')+
      (areas.length
        ?'<div style="margin-top:4px">'+areas.slice(0,SUM_MAX).map(a=>{
          const ah=AREA_HUE[a.relation_type]||'teal';
          const reg=REGION_BY.get(a.name);
          return frow({hue:ah,shape:'sq',
            inner:reg?sigilInner(reg):'<svg><use href="#i-map"/></svg>',
            name:a.name,
            chips:chip(ah,AREA_ICON[a.relation_type]||'i-map',L('area.relation',a.relation_type))+
                  (reg?'':chip('amber','i-warn','未登记为地区记录')),
            title:a.name+'　'+L('area.relation',a.relation_type)});
        }).join('')+'</div>'+rest(areas.length,'处地区')
        :thinNote('这个势力目前没有与任何地区的直接联系'))+
    '</div>'+

    /* 内部群体：谁在这个势力里面、什么立场。行动和影响在浮层里。
       立场是一整句（「要求先保住码头日结工的活计」），做不成胶囊，跟在名字后面折行。 */
    '<div class="frule"></div>'+
    '<div class="sect h-'+hue+'">'+
      sectionH('i-people','内部群体')+
      (grp.length
        ?'<div style="margin-top:4px">'+grp.slice(0,SUM_MAX).map(g=>
          frow({hue:'purple',shape:'crest',inner:'<span>'+esc(String(g.name||'?').slice(0,1))+'</span>',
            name:g.name,val:g.position,
            title:(g.name||'')+'　立场：'+(g.position||'未记录')}))
          .join('')+'</div>'+rest(grp.length,'个群体')
        :thinNote('这个势力没有登记与当前问题相关的内部群体'))+
    '</div>'+

    /* 原型这一节叫「最近动向」，取的就是已经显现出来的后果。地点和关联事件在浮层里。 */
    '<div class="frule"></div>'+
    '<div class="sect h-'+hue+'">'+
      sectionH('i-eye','最近动向')+
      (effNew.length
        ?'<div style="margin-top:4px">'+effNew.slice(0,2).map(v=>
          frow({hue:'teal',shape:'rd',inner:'<svg><use href="#i-eye"/></svg>',
            name:P.timeHH(v.time)||v.time||'时间未记录',val:v.effect||'未记录后果',
            title:(v.time||'')+'　'+(v.location||'')+'　'+(v.effect||'')}))
          .join('')+'</div>'+
          (effNew.length>2?'<p class="nodata" style="margin-top:7px">还有 '+(effNew.length-2)+' 条在完整档案里</p>':'')
        :thinNote('这个势力本轮没有对外显现的公开后果'))+
    '</div>'+

    /* 通往完整档案。按钮上写清里面装着什么，而不是"展开更多"——
       点开是一整份档案，不是这一节的下半截。 */
    '<div style="padding:12px 18px 0">'+
      '<button class="paction" id="dossierBtn" data-open-sheet style="margin:0;width:100%;justify-content:center;'+
        'background:var(--sunken)" title="'+
        esc('资源 '+res.length+' 项 · 对外关系 '+rel.length+' 条 · 地区 '+areas.length+' 处 · 内部群体 '+
            grp.length+' 个 · 情报 '+know.length+' 条 · 公开后果 '+eff.length+' 条')+'">'+
        '翻开完整档案 ⤢</button></div>'+

    /* 中日文没有词间空格，浏览器可以在任意两字之间断行——右栏 344px 下这一行原来
       折在「下次检 / 查」中间。给两个前缀各上一道 nowrap，断点就只能落在冒号后面。 */
    '<div class="nowline">✧　<span style="white-space:nowrap">已推演到 '+esc(f.updated_at||'未记录')+
      '</span>　·　<span style="white-space:nowrap">下次检查：</span>'+
      esc(f.next_update||'待条件触发')+'　✧</div>';

  $('#dossierBtn').addEventListener('click',openDossier);
  wireLinks(el);
}

/* =============================================================================
   完整档案浮层
   1080px 宽，一条记录一个块，一行摆两块，不折叠、不翻页。
   摘要卡里没地方放的十七个子字段全在这里：
     resources  current_use / constraint / recent_change
     relations  target_type / current_basis / recent_change / changed_at
     areas      current_state / recent_change（外加由 relation_type 推的关系深浅）
     internal_groups  name / position / current_action / effect
     knowledge  fact / source / source_type / learned_at / status
     visible_effects  location / related_event

   字段名一律取两个字的普通名词：用途、限制、依据、现状、立场、行动、影响。
   契约里那些名字带「当前」前缀（current_use / current_basis / current_state），
   是拿来跟历史值区分的——界面本来就只显示当前值，把前缀照抄过来只剩公文腔。
   ========================================================================== */
function renderDossier(){
  const f=curFaction();
  const box=$('#dossierBody');
  if(!f){box.innerHTML=emptyNote('本轮没有势力记录');return}
  const hue=hueOf('f:'+f.name);
  const fh=FACTION_HUE[f.status]||'indigo';
  const focus=f.current_focus||{};
  const areas=arr(f.areas),res=arr(f.resources),grp=arr(f.internal_groups);
  const rel=arr(f.relations),know=arr(f.knowledge),eff=arr(f.visible_effects);
  const defer=arr(focus.deferred_items);

  const sec=(icon,title,body)=>'<section class="dsec h-'+hue+'">'+sectionH(icon,title)+body+'</section>';

  box.innerHTML=
    '<div class="fhead h-'+hue+'" style="padding:0 0 12px">'+
      '<span class="fcrest" title="'+esc(crestBasis(f))+'">'+crestInner(f)+'</span>'+
      '<span class="fmeta"><h3>'+esc(f.name)+
        chip(fh,FACTION_ICON[f.status]||'i-spark',L('faction.status',f.status))+'</h3>'+
        /* 这一段整个包进一个 span。.fmeta p 是 flex 容器，裸文本节点会各自变成
           flex item 被单独压缩——390 档下「海盗代表答复停火文本时」被压成了
           一列竖排的字。flex 里只留图标和这一个 span，文字就照常折行。 */
        '<p><svg><use href="#i-spark"/></svg><span>'+
          '<span style="white-space:nowrap">已推演到 '+esc(f.updated_at||'未记录')+'</span>　·　'+
          '<span style="white-space:nowrap">下次检查：</span>'+
          esc(f.next_update||'待条件触发')+'</span></p></span>'+
    '</div>'+

    /* 当前焦点只有一条记录，主句就是那个问题本身；行动和暂缓挂在它下面。 */
    sec('i-flag','当前焦点',drec(
      (focus.issue||focus.action||defer.length)?[{
        head:focus.issue||'本轮没有记录最主要的问题',
        lines:[
          ['行动',focus.action||'本轮没有已决定或正在执行的行动'],
          ['暂缓',defer.length
            ?raw('<span class="chiprow">'+defer.map(d=>chip('amber','',d)).join('')+'</span>')
            :'没有因资源或分歧而暂缓的事项'],
        ],
      }]:[],
      '本轮没有记录当前焦点'))+

    /* 资源的主句是数量——「可动用 82,150 金币」，类型做成胶囊跟在后面。
       反过来把类型当主句，两条资源的开头就都是一个干巴巴的词。 */
    sec('i-coin','资源储备',drec(
      res.map(x=>({
        head:x.quantity||'数量未记录',
        chips:chip(RES_HUE[x.type]||'teal',RES_ICON[x.type]||'i-spark',L('resource.type',x.type)),
        lines:[['用途',x.current_use||'未记录用途'],['限制',x.constraint||'未记录限制']],
        hasChange:!!x.recent_change,change:x.recent_change||'本轮无变化',
      })),
      '本轮没有记录在案的资源'))+

    /* relations[] 的对象可能是人物／任务／事件，格局图上没有它们的节点，
       所以这一节是它们唯一排得全的地方。 */
    sec('i-link','对外关系',drec(
      rel.map(r=>({
        head:r.target_name,
        chips:chip('teal',TARGET_ICON[r.target_type||'other']||'i-spark',L('relation.target',r.target_type||'other'))+
              chip(REL_HUE[r.relation_type]||'indigo','',L('relation.type',r.relation_type)),
        lines:[['依据',r.current_basis||'未记录依据']],
        hasChange:!!r.recent_change,
        change:r.recent_change?r.recent_change+(r.changed_at?'（'+r.changed_at+'）':''):'本轮无变化',
      })),
      '本轮没有记录在案的对外关系'))+

    sec('i-map','地区联系',drec(
      areas.map(a=>{
        const rank=AREA_RANK[a.relation_type]||0;
        return {
          head:a.name,
          chips:chip(AREA_HUE[a.relation_type]||'teal',AREA_ICON[a.relation_type]||'i-map',L('area.relation',a.relation_type))+
                (REGION_BY.get(a.name)?'':chip('amber','i-warn','未登记为地区记录')),
          lines:[
            ['现状',a.current_state||'未记录现状'],
            ['深浅',raw(steps(rank,6,AREA_HUE[a.relation_type]||'teal','',
              AREA_RANK_NOTE+'；当前第 '+rank+' 档，由 relation_type 推导，不是评分也不是百分比'))],
          ],
          hasChange:!!a.recent_change,change:a.recent_change||'本轮无变化',
        };
      }),
      '这个势力目前没有与任何地区的直接联系'))+

    sec('i-people','内部群体',drec(
      grp.map(g=>({
        head:g.name,
        lines:[['立场',g.position||'未记录立场'],['行动',g.current_action||'未记录行动'],
               ['影响',g.effect||'未记录影响']],
      })),
      '这个势力没有登记与当前问题相关的内部群体'))+

    /* 情报的主句是那条事实本身，可信度紧跟着它——一条不可信的消息，
       可信度跟内容分开摆就等于没说。来源和获知时间是佐证，放下面。 */
    sec('i-ask','已掌握情报',drec(
      know.map(k=>({
        head:k.fact,
        chips:chip(KST_HUE[k.status]||'indigo','',L('knowledge.status',k.status)),
        lines:[
          ['来源',raw(esc(k.source||'未记录来源')+
            chip('teal',KSRC_ICON[k.source_type]||'i-ask',L('knowledge.source',k.source_type)))],
          ['获知',raw('<span class="tm">'+esc(k.learned_at||'获知时间未记录')+'</span>')],
        ],
      })),
      '本轮没有探到值得记下的消息'))+

    sec('i-eye','已显现的公开后果',drec(
      eff.slice().sort(WTime.byNewest('time')).map(v=>({
        head:v.effect,
        lines:[
          ['时刻',raw('<span class="tm">'+esc(v.time||'时间未记录')+'</span>')],
          ['地点',v.location||'地点未记录'],
          ['关联',v.related_event
            ?raw('<span class="linkrow" style="margin-top:0">'+taskLink(v.related_event,'event')+'</span>')
            :'未关联事件'],
        ],
      })),
      '这个势力本轮没有对外显现的公开后果'));

  wireLinks(box);
}
function openDossier(){$('#dossier').hidden=false;renderDossier()}
const closeDossier=()=>{$('#dossier').hidden=true};

/* =============================================================================
   索引：地区列表 / 热点事件 / 关系摘要
   ========================================================================== */
const IDX_PAGE=5;               // 窄屏竖着堆时一页放几条；宽屏按一排摆得下几格算
const TABS=['地区','热点','势力关系'];

/* 一排摆得下几格，一页就放几条——跟底部时间线同一套办法（见 wtlPageSize）。
   写死 5 条的话，1300px 只排得下四格，第五条自己占第二排：右边空掉四分之三排，
   面板还平白高一截。窄屏排成一到两列时本来就是竖着堆，没有这个问题，仍按 5 条一页。 */
function idxPageSize(){
  const el=$('#idxBody');if(!el)return IDX_PAGE;
  const t=getComputedStyle(el).gridTemplateColumns;
  const cols=t&&t!=='none'?t.split(' ').filter(Boolean).length:1;
  return cols>=3?cols:IDX_PAGE;
}
function renderIdxNav(page,pages,onGo){
  const el=$('#idxNav');
  if(pages<=1){el.innerHTML='';return}
  el.innerHTML=
    '<button data-d="-1"'+(page===0?' disabled':'')+' aria-label="上一页"><svg><use href="#i-prev"/></svg></button>'+
    '<i>'+(page+1)+' / '+pages+'</i>'+
    '<button data-d="1"'+(page===pages-1?' disabled':'')+' aria-label="下一页"><svg><use href="#i-next"/></svg></button>';
  $$('#idxNav button').forEach(b=>b.addEventListener('click',()=>onGo(page+Number(b.dataset.d))));
}

/** 热点：地区变化与势力公开后果里出现过的任务与事件，按牵动面归并。 */
function hotspots(){
  const m=new Map();
  const put=(kind,name,where,fact,time)=>{
    if(!name)return;
    const k=kind+'|'+name;
    if(!m.has(k))m.set(k,{kind,name,where:new Set(),facts:[],time:''});
    const it=m.get(k);
    if(where)it.where.add(where);
    if(fact)it.facts.push(fact);
    if(time&&(!it.time||(WTime.parse(time)||0)>(WTime.parse(it.time)||0)))it.time=time;
  };
  REGIONS.forEach(r=>arr(r.recent_changes).forEach(c=>{
    put('event',c.related_event,r.name,c.fact,c.time);
    put('task',c.related_task,r.name,c.fact,c.time);
  }));
  FACTIONS.forEach(f=>arr(f.visible_effects).forEach(v=>
    put('event',v.related_event,v.location||f.name,v.effect,v.time)));
  return [...m.values()].sort(WTime.byNewest('time'));
}

/** 关系摘要：所有势力的 relations 摊平，双方各记一次的合并成一条。 */
function relSummary(){
  const seen=new Set(),out=[];
  FACTIONS.forEach(f=>arr(f.relations).forEach(r=>{
    const k=[f.name,r.target_name].sort().join('~')+'|'+r.relation_type;
    if(seen.has(k))return;
    seen.add(k);
    out.push({from:f.name,to:r.target_name,type:r.relation_type,target:r.target_type,
      basis:r.current_basis,change:r.recent_change,at:r.changed_at});
  }));
  return out;
}

function renderIdx(){
  $('#tabs').innerHTML=TABS.map((t,i)=>'<button class="'+(i===idxTab?'on':'')+'" data-i="'+i+'">'+t+'</button>').join('');
  // 先定这一页签的最小格宽，再量一排放得下几个——顺序反了会拿上一个页签的宽度算
  $('#idxBody').style.setProperty('--idxmin',idxTab===0?'230px':'300px');
  const body=$('#idxBody'),per=idxPageSize();
  let all=[],html='',pages=1;
  // 一排摆得下 per 个，页数按 per 定，条目由 pageSlice 摊匀（五条分两页是 3+2 不是 4+1）
  const pageOf=list=>{
    const r=P.pageSlice(list,per,idxPage);
    pages=r.pages;idxPage=r.page;
    return r.items;
  };

  if(idxTab===0){
    all=sortedRegions();
    // 三个页签的副标题只解释"这份名单是怎么攒出来的"——那是屏幕上看不出来的事。
    // 地区总数在下面「各地情势」里一条条列着，这儿不再报一遍。
    $('#idxSub').textContent='';
    html=pageOf(all).map(r=>{
      const c=r.control||{},hue=CONTROL_HUE[c.status]||'indigo';
      const rank=CONTROL_RANK[c.status]||0;
      return '<button class="idx h-'+hue+'" data-r="'+esc(r.name)+'">'+
        '<span class="idx-i" title="'+esc(sigilBasis(r))+'">'+sigilInner(r)+'</span>'+
        '<span class="idx-n">'+esc(r.name)+'</span>'+
        chip(hue,CONTROL_ICON[c.status]||'i-ask',L('control.status',c.status))+
        steps(rank,5,hue,c.primary_faction||'无归属势力',
          CONTROL_RANK_NOTE+'；当前第 '+rank+' 档，由 control.status 推导，不是评分也不是百分比')+
      '</button>';
    }).join('')||emptyNote('本轮没有地区记录');
  }else if(idxTab===1){
    all=hotspots();
    $('#idxSub').textContent='地区变化与势力公开后果里牵到的任务和事件';
    html=pageOf(all).map(h=>{
      const hue=h.kind==='event'?'rose':'indigo';
      return '<button class="idx h-'+hue+'" data-name="'+esc(h.name)+'" data-kind="'+h.kind+'">'+
        '<span class="idx-i"><svg><use href="#'+(h.kind==='event'?'i-bell':'i-scroll')+'"/></svg></span>'+
        '<span class="idx-n">'+esc(h.name)+'</span>'+
        chip(hue,'',h.kind==='event'?'事件':'任务')+
        '<p>'+esc([...h.where].join('、'))+'　·　'+esc(h.time||'时间未记录')+'<br>'+esc(h.facts[0]||'')+'</p>'+
      '</button>';
    }).join('')||emptyNote('本轮的地区变化没有关联到任务或事件');
  }else{
    all=relSummary();
    $('#idxSub').textContent='双方各记一次的同一条关系已并成一条';
    html=pageOf(all).map(r=>{
      const hue=REL_HUE[r.type]||'indigo';
      return '<button class="idx h-'+hue+'" data-fac2="'+esc(r.from)+'">'+
        '<span class="idx-i"><svg><use href="#'+(TARGET_ICON[r.target]||'i-spark')+'"/></svg></span>'+
        '<span class="idx-n">'+esc(r.from+' → '+r.to)+'</span>'+
        chip(hue,'',L('relation.type',r.type))+
        '<p>'+esc(r.basis||'未记录依据')+'　·　'+
          esc(r.change?r.change+(r.at?'（'+r.at+'）':''):'本轮无变化')+'</p>'+
      '</button>';
    }).join('')||emptyNote('本轮没有势力关系记录');
  }

  body.innerHTML=html;
  renderIdxNav(idxPage,pages,n=>{idxPage=n;renderIdx()});

  $$('#tabs button').forEach(b=>b.addEventListener('click',()=>{idxTab=Number(b.dataset.i);idxPage=0;renderIdx()}));
  $$('#idxBody .idx[data-r]').forEach(b=>b.addEventListener('click',()=>pickNode('r:'+b.dataset.r)));
  $$('#idxBody .idx[data-fac2]').forEach(b=>b.addEventListener('click',()=>{
    const i=FACTIONS.findIndex(f=>f.name===b.dataset.fac2);
    if(i>=0)pickNode('f:'+FACTIONS[i].name);
  }));
  $$('#idxBody .idx[data-name]').forEach(b=>b.addEventListener('click',()=>{
    P.goto('tasks', { focus: b.dataset.name });
  }));
}

/* =============================================================================
   底部通栏：世界演进时间线
   由 faction.visible_effects 与 region.recent_changes 合流，都是已发生的事实。
   ========================================================================== */
const WTL_PAGE=5;
/* auto-fill 摆得下几格，一页就放几条。固定 5 条时 1280 只排得下 4 格，
   第 5 条独占第二排，右边空掉四分之三个通栏，看着像没做完。
   空网格也会生成轨道，所以填内容之前就能量出列数。 */
function wtlPageSize(){
  const el=$('#wtl');if(!el)return WTL_PAGE;
  const t=getComputedStyle(el).gridTemplateColumns;
  const cols=t&&t!=='none'?t.split(' ').filter(Boolean).length:1;
  return cols>=3?cols:WTL_PAGE;   // 单列／双列是堆叠，本来就没有空当
}
function wtlItems(){
  const out=[];
  FACTIONS.forEach(f=>arr(f.visible_effects).forEach(v=>out.push({
    time:v.time,title:v.effect,who:f.name,kind:'faction',where:v.location,
    link:v.related_event,linkKind:'event',hue:hueOf('f:'+f.name)})));
  REGIONS.forEach(r=>arr(r.recent_changes).forEach(c=>out.push({
    time:c.time,title:c.fact,who:r.name,kind:'region',where:r.name,
    link:c.related_event||c.related_task,linkKind:c.related_event?'event':'task',
    hue:hueOf('r:'+r.name)})));
  return out.sort(WTime.byNewest('time'));
}
function renderWtl(){
  const all=wtlItems(),size=wtlPageSize();
  const pages=Math.max(1,Math.ceil(all.length/size));
  wtlPage=Math.min(wtlPage,pages-1);
  // 一页之内按时间正序摆回去，读起来才是一条时间线
  const page=slice(all,size,wtlPage).slice().reverse();
  const newest=all[0];
  // 条数和排序在下面的翻页条上，这里只说这条线是由哪两路数据汇起来的
  $('#wtlSub').textContent='势力已显现的公开后果，与各地区的近期变化，合在一条线上';

  $('#wtl').innerHTML=page.length?page.map(x=>
    '<button class="wti h-'+x.hue+(newest&&x===newest?' now':'')+'" '+
      (x.link?'data-name="'+esc(x.link)+'"':'')+'>'+
      '<span class="wt"><time>'+esc(P.timeHH(x.time)||x.time||'—')+'</time>'+
        '<span class="wsrc"><svg><use href="#'+(x.kind==='faction'?'i-shield':'i-map')+'"/></svg>'+esc(x.who)+'</span></span>'+
      '<b>'+esc(x.title||'未记录变化')+'</b>'+
      (x.link?'<small><svg><use href="#'+(x.linkKind==='event'?'i-bell':'i-scroll')+'"/></svg>'+esc(x.link)+'</small>'
             :'<small style="color:var(--ink4)"><svg><use href="#i-ask"/></svg>未关联任务或事件</small>')+
    '</button>').join(''):emptyNote('本轮没有已发生的势力或地区变化');

  renderPager($('#wtlPager'),{page:wtlPage,pages,total:all.length,unit:'条',
    note:'按时间倒序',onGo:n=>{wtlPage=n;renderWtl()}});
  $$('#wtl .wti[data-name]').forEach(b=>b.addEventListener('click',()=>{
    P.goto('tasks', { focus: b.dataset.name });
  }));
}

/* ---------- 启动 ---------- */
function renderAll(){
  buildHues();buildIndex();
  renderGraph();renderEdgeFoot();renderStance();renderRegions();renderIdx();renderWtl();
}
P.initChrome('势力与地区');
/* 首屏先把当前势力最相关的那个地区行展开：五行全收着的话，
   「查看详情里还有条件和近期变化」这件事根本没人会发现。 */
(function openFirstRow(){
  const f=curFaction();
  const hit=f&&arr(f.areas).map(a=>a.name).find(n=>REGIONS.some(r=>r.name===n));
  const name=hit||(REGIONS[0]||{}).name;
  if(name)rowOpen.add(name);
})();
renderAll();

$('#graphToggle').addEventListener('click',e=>{
  graphOpen=!graphOpen;
  e.currentTarget.textContent=graphOpen?'收拢画面 ⤡':'放开画面 ⤢';
  renderGraph();
});
$('#regionExpandAll').addEventListener('click',e=>{
  if(rowOpen.size===REGIONS.length){rowOpen.clear();e.currentTarget.textContent='全部展开 ⌄'}
  else{REGIONS.forEach(r=>rowOpen.add(r.name));e.currentTarget.textContent='全部收起 ⌃'}
  renderRegions();
});
/* 完整档案浮层：点遮罩关、Esc 关、✕ 关，跟总览页那张全图浮层同一套约定 */
$('#dossierClose').addEventListener('click',closeDossier);
$('#dossier').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDossier()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDossier()});

// 节点坐标是按像素算的，面板宽度变了必须重排
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{
  // 名录和时间线一排放几条都是量出来的，宽度变了得重新算
  renderGraph();renderWtl();renderIdx();
  if(!$('#dossier').hidden)renderDossier();
},160)});

/* 压力测试钩子：契约对 areas / relations / present_factions 这些数组给了上限，
   但没限制势力和地区的条数，所以布局必须在"节点很多"时也不叠字。
   _tools/graph-stress.cjs 通过这个钩子灌一组假数据，不动 mock 文件。 */
window.__stressGraph=function(nf,nr,d){
  /* d 是每个对象各挂几条子记录，不传就顶到契约上限（最凶的一档）。
     传了就能造"数量真实但比上限松"的一档，例如 __stressGraph(10,12,{rel:4,area:2,contest:1})
     大致对应 40 条 relations。 */
  d=d||{};
  const nRel=d.rel||10,nArea=d.area||8,nContest=d.contest==null?5:d.contest,nPresent=d.present||8;
  const REL=['alliance','cooperation','trade','rivalry','hostility','influence','contact','debt'];
  const AR=['control','operate','garrison','influence','contested','transit'];
  const RT=['funds','personnel','supplies','transport','information','sites','authority'];
  const CT=['commerce','order','access','population','infrastructure','supply'];
  FACTIONS=Array.from({length:nf},(_,i)=>({
    name:'第'+(i+1)+'联合行会总议事厅',status:'active',updated_at:'霜月12日 22:00',
    next_update:'下一次例会时',
    current_focus:{issue:'压力测试用问题'+i,action:'压力测试用行动'+i,deferred_items:['暂缓一','暂缓二','暂缓三','暂缓四']},
    areas:Array.from({length:nArea},(_,k)=>({name:'第'+((i+k)%nr+1)+'远境要塞城邦',relation_type:AR[k%6],
      current_state:'压力测试事实',recent_change:k%2?'':'压力测试变化'})),
    resources:Array.from({length:8},(_,k)=>({type:RT[k%7],quantity:'数量'+k,current_use:'占用'+k,constraint:'限制'+k,recent_change:''})),
    internal_groups:Array.from({length:6},(_,k)=>({name:'内部群体'+k,position:'立场'+k,current_action:'行动'+k,effect:'影响'+k})),
    /* 契约允许 target_type 是 person / task / event，格局图上没有这三类的节点。
       每第四条造一个，好让"图上不画、档案里记"这条出口在压测里真的被走到。 */
    relations:Array.from({length:nRel},(_,k)=>({
      // 三类场外目标要都出现，不能只造出人物一种：换势力就换一类
      target_type:k%4===3?['person','task','event'][(i+Math.floor(k/4))%3]:(k%3===2?'region':'faction'),
      target_name:k%4===3?'场外对象'+k:(k%3===2?'第'+((i+k)%nr+1)+'远境要塞城邦':'第'+((i+k+1)%nf+1)+'联合行会总议事厅'),
      relation_type:REL[k%8],current_basis:'依据'+k,recent_change:'',changed_at:''})),
    knowledge:Array.from({length:10},(_,k)=>({fact:'情报'+k,source:'来源'+k,source_type:'reported',learned_at:'霜月12日 20:00',status:'uncertain'})),
    visible_effects:Array.from({length:6},(_,k)=>({time:'霜月12日 2'+(k%10)+':00',location:'地点'+k,effect:'后果'+k,related_event:''})),
  }));
  REGIONS=Array.from({length:nr},(_,i)=>({
    name:'第'+(i+1)+'远境要塞城邦',updated_at:'霜月12日 22:00',next_update:'下一次巡查时',
    control:{status:['controlled','shared','contested','unclaimed','unclear'][i%5],
      primary_faction:'第'+(i%nf+1)+'联合行会总议事厅',
      contesting_factions:Array.from({length:nContest},(_,k)=>'第'+((i+k+1)%nf+1)+'联合行会总议事厅')},
    present_factions:Array.from({length:nPresent},(_,k)=>'第'+((i+k)%nf+1)+'联合行会总议事厅'),
    conditions:Array.from({length:6},(_,k)=>({category:CT[k%6],fact:'条件'+k,impact:'影响'+k})),
    recent_changes:Array.from({length:6},(_,k)=>({time:'霜月12日 1'+(k%10)+':00',fact:'变化'+k,related_task:'',related_event:''})),
  }));
  selFaction=0;selEdge=-1;regionPage=0;idxPage=0;wtlPage=0;rowOpen.clear();
  renderAll();
  return {factions:FACTIONS.length,regions:REGIONS.length,edges:EDGES.length};
};
</script>
