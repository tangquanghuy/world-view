<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>后台世界引擎</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4efe6; }
  #frames { position: relative; width: 100%; height: 100%; }
  #frames iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #f4efe6;
    visibility: hidden; pointer-events: none; z-index: 0;
  }
  #frames iframe.is-on { visibility: visible; pointer-events: auto; z-index: 2; }
  #status {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 28px;
    color: #695d50; background: #f4efe6; text-align: center;
    font: 14px/1.7 "Microsoft YaHei", sans-serif;
  }
  #status[hidden] { display: none; }
  #status strong { display: block; margin-bottom: 6px; color: #39322c; font-size: 17px; }
  #status small { display: block; max-width: 620px; color: #8b7c6d; }
</style>
</head>
<body>
<div id="status"><div><strong>正在连接异步助手数据…</strong><small>等待后台世界引擎结构化视图。</small></div></div>
<div id="frames" hidden></div>
<script>
/**
 * 静态站单入口：四页仍是独立 HTML（方便截图/体检工具），对外只暴露一个 URL。
 * 路由：#/overview | #/characters | #/factions | #/tasks
 * 子页通过 window.parent.WE_SPA.navigate 或 postMessage({type:'we-goto'}) 切页。
 *
 * 切页保活：每个路由一个 iframe，显隐切换，不重复拆文档。
 * 数据更新：改 WE_WORLD_DATA 后 postMessage we-world-refresh，子页就地重绘。
 */
(function () {
  'use strict';

  const ROUTES = {
    overview: '总览.html',
    characters: '角色档案.html',
    factions: '势力与地区.html',
    tasks: '任务与事件.html',
  };
  const DEFAULT = 'overview';
  // 同时订阅各版本方案的视图，排位高的有数据就用它：v1.2 > v1.1 > v1.0 > v0.9。
  // v1.1、v1.2 只改了字段说明和提示词，数据形状和 v1.0 相同；v0.9 进页面前转成 v1.0 形状。
  // 方案里没有的视图只会静默不回，所以全部订阅也不会报错。
  const VIEWS = [
    { watchId: 'bg-world-panel-v12', viewId: 'bg_world_structured_v12', shape: 'v10', rank: 4 },
    { watchId: 'bg-world-panel-v11', viewId: 'bg_world_structured_v11', shape: 'v10', rank: 3 },
    { watchId: 'bg-world-panel', viewId: 'bg_world_structured_v10', shape: 'v10', rank: 2 },
    { watchId: 'bg-world-panel-v09', viewId: 'bg_world_structured_v09', shape: 'v09', rank: 1 },
  ];
  const WATCH_ID = 'bg-world-panel';
  let dataVersion = '';
  let dataRank = 0;
  const bridgeEnabled = new URLSearchParams(location.search).get('acuBridge') === '1';
  const framesRoot = document.getElementById('frames');
  const status = document.getElementById('status');
  const frames = Object.create(null);
  let current = '';
  let pending = '';
  let hasData = false;
  let bridgeTimer = 0;
  let prefetchStarted = false;

  function setStatus(title, detail) {
    status.innerHTML = '<div><strong>' + title + '</strong><small>' + (detail || '') + '</small></div>';
    status.hidden = false;
    framesRoot.hidden = true;
  }

  function extractWorld(result) {
    const data = result && result.data;
    const world = data && data.background_world;
    if (!world || typeof world !== 'object') throw new Error('视图缺少 data.background_world');

    const sections = ['world', 'changes', 'npcs', 'factions', 'candidates', 'tasks', 'events', 'regions', 'exclusions'];
    for (const key of sections) if (!Array.isArray(world[key])) world[key] = [];

    // 结构化视图必须保留原始英文键；中文 alias 会让现有页面所有字段失配。
    const meta = world.world[0];
    if (meta && !Object.prototype.hasOwnProperty.call(meta, 'world_time')
      && Object.prototype.hasOwnProperty.call(meta, '当前世界时间')) {
      throw new Error('后台世界结构化视图仍在输出中文字段别名');
    }
    return world;
  }

  // ---- v0.9 → v1.0：删掉的字段并进保留字段，各类「痕迹」统一进 changes ----
  const SOURCE_TYPE_LABEL = { witnessed: '亲眼所见', record: '记录', reported: '转述', public: '公开消息', rumor: '传闻', inferred: '推断' };
  function joinText() {
    return Array.prototype.slice.call(arguments).map(function (x) { return String(x == null ? '' : x).trim(); }).filter(Boolean).join('；');
  }
  function arrOf(v) { return Array.isArray(v) ? v : []; }
  function personToV10(p, isNpc, logs) {
    const out = Object.assign({}, p);
    const profile = Object.assign({}, out.profile || {});
    if (profile.social_role) profile.occupation = joinText(profile.occupation, profile.social_role);
    delete profile.social_role;
    out.profile = profile;
    const cs = Object.assign({}, out.current_state || {});
    delete cs.started_at;
    out.current_state = cs;
    out.schedule = arrOf(out.schedule).map(function (s) {
      const x = Object.assign({}, s); delete x.related_task; delete x.related_event; return x;
    });
    out.conditions = arrOf(out.conditions).map(function (c) {
      const x = Object.assign({}, c);
      x.impact = joinText(c.impact, c.review_condition && ('复核：' + c.review_condition));
      delete x.review_condition; return x;
    });
    out.decisions = arrOf(out.decisions).map(function (d) {
      return {
        question: joinText(d.question, d.waiting_for && ('在等：' + d.waiting_for)),
        options: arrOf(d.options).map(function (o) {
          if (typeof o === 'string') return o;
          return o && o.cost ? (o.choice || '') + '（' + o.cost + '）' : (o && o.choice) || '';
        }).filter(Boolean),
      };
    });
    out.relations = arrOf(out.relations).map(function (r) {
      const x = Object.assign({}, r); delete x.changed_at; delete x.favorability_change; return x;
    });
    if (isNpc) {
      out.commitments = arrOf(out.commitments).map(function (c) {
        const x = Object.assign({}, c);
        x.deadline = joinText(c.deadline, c.release_condition && ('解除：' + c.release_condition));
        delete x.release_condition; return x;
      });
      out.knowledge = arrOf(out.knowledge).map(knowledgeToV10);
      arrOf(out.visible_effects).forEach(function (v) {
        logs.push({ time: v.time, kind: 'effect', source_type: 'npc', source_name: p.name, target_name: v.related_event || '', summary: v.effect, location: v.location || '' });
      });
      const se = out.scene_entry;
      if (se && (se.reason || se.earliest_time || se.location)) {
        out.schedule.push({ start_time: se.earliest_time || '', end_time: '', location: se.location || '', action: joinText('接触「我」：' + (se.reason || ''), se.condition), status: 'planned', result: '' });
      }
    } else {
      out.observations = arrOf(out.observations).map(function (o) {
        return o && o.content !== undefined ? o : { time: o && o.time || '', content: joinText(o && o.situation, o && o.action, o && o.result) };
      });
    }
    delete out.visible_effects; delete out.scene_entry; delete out.retention;
    delete out.updated_at; delete out.next_update;
    return out;
  }
  function knowledgeToV10(k) {
    const x = Object.assign({}, k);
    x.source = joinText(k.source, SOURCE_TYPE_LABEL[k.source_type] || k.source_type, k.learned_at && (k.learned_at + '得知'));
    delete x.source_type; delete x.learned_at;
    return x;
  }
  function toV10(world) {
    const logs = [];
    world.npcs = world.npcs.map(function (p) { return personToV10(p, true, logs); });
    world.candidates = world.candidates.map(function (p) { return personToV10(p, false, logs); });
    world.factions = world.factions.map(function (f) {
      const x = Object.assign({}, f);
      x.areas = arrOf(f.areas).map(function (a) { const y = Object.assign({}, a); delete y.recent_change; return y; });
      x.resources = arrOf(f.resources).map(function (r) {
        const y = Object.assign({}, r);
        y.current_use = joinText(r.current_use, r.constraint && ('限制：' + r.constraint));
        delete y.constraint; delete y.recent_change; return y;
      });
      x.internal_groups = arrOf(f.internal_groups).map(function (g) {
        const y = Object.assign({}, g); y.current_action = joinText(g.current_action, g.effect); delete y.effect; return y;
      });
      x.relations = arrOf(f.relations).map(function (r) { const y = Object.assign({}, r); delete y.changed_at; return y; });
      x.knowledge = arrOf(f.knowledge).map(knowledgeToV10);
      arrOf(f.visible_effects).forEach(function (v) {
        logs.push({ time: v.time, kind: 'effect', source_type: 'faction', source_name: f.name, target_name: v.related_event || '', summary: v.effect, location: v.location || '' });
      });
      delete x.visible_effects; delete x.updated_at; delete x.next_update;
      return x;
    });
    world.regions = world.regions.map(function (r) {
      const x = Object.assign({}, r);
      if (x.control) { x.control = Object.assign({}, x.control); delete x.control.contesting_factions; }
      arrOf(r.recent_changes).forEach(function (c) {
        logs.push({ time: c.time, kind: 'region', source_type: 'region', source_name: r.name, target_name: c.related_event || c.related_task || '', summary: c.fact, location: r.name });
      });
      delete x.present_factions; delete x.recent_changes; delete x.updated_at; delete x.next_update;
      return x;
    });
    const knownNames = new Set([].concat(world.npcs, world.candidates, world.factions)
      .map(function (e) { return e && e.name; }).filter(Boolean));
    world.tasks = world.tasks.map(function (t) {
      const x = Object.assign({}, t);
      x.participants = arrOf(t.participants).map(function (p) { const y = Object.assign({}, p); delete y.type; return y; });
      // v0.9 的 source 有时是人名，有时是一句「谁委托、为什么」。
      // 只有能对上已登记的人物/势力时才当成委托方参与者；对不上的整句并进目标，不伪装成一个人。
      const src = String(t.source || '').trim();
      if (src) {
        const inList = x.participants.find(function (p) { return p && p.name === src; });
        if (inList) inList.role = '委托方';
        else if (knownNames.has(src)) x.participants.unshift({ name: src, role: '委托方' });
        else x.objective = joinText(t.objective, '来源：' + src);
      }
      if (t.failure_condition) x.completion_condition = joinText(t.completion_condition, '失败：' + t.failure_condition);
      x.stages = arrOf(t.stages).map(function (s) { const y = Object.assign({}, s); delete y.parent_stage; return y; });
      delete x.source; delete x.failure_condition; delete x.updated_at; delete x.next_update;
      return x;
    });
    world.events = world.events.map(function (e) {
      const x = Object.assign({}, e);
      x.participants = arrOf(e.participants).map(function (p) { const y = Object.assign({}, p); delete y.type; return y; });
      arrOf(e.visible_effects).forEach(function (v) {
        logs.push({ time: v.time, kind: 'event', source_type: 'event', source_name: e.name, target_name: '', summary: v.effect, location: v.location || '' });
      });
      delete x.visible_effects; delete x.updated_at; delete x.next_update;
      return x;
    });
    const seen = new Set(world.changes.map(function (c) { return [c.time, c.source_name, c.summary].join('|'); }));
    logs.forEach(function (l) {
      if (!l.summary) return;
      const key = [l.time, l.source_name, l.summary].join('|');
      if (seen.has(key)) return;
      seen.add(key);
      world.changes.push(l);
    });
    return world;
  }

  // 演进面板业务：副 AI 从零 add /npc 时，用 AcuData.applyPatches 改写到候选。
  // 用户晋升也走 applyPatches，source 是 acu-data，不会进这里。橱窗壳只转发事件，不认人。
  let pendingAiNpcNames = null;

  function listOf(world, key) {
    return Array.isArray(world && world[key]) ? world[key] : [];
  }

  function npcToCandidate(p) {
    const row = {
      name: p.name,
      status: 'observe',
      profile: p.profile || {},
      current_state: p.current_state || {},
      schedule: Array.isArray(p.schedule) ? p.schedule : [],
      conditions: Array.isArray(p.conditions) ? p.conditions : [],
      relations: Array.isArray(p.relations) ? p.relations : [],
      decisions: Array.isArray(p.decisions) ? p.decisions : [],
      observations: Array.isArray(p.observations) ? p.observations : [],
    };
    // v0.9 存档的候选表还有这两列，照旧写上，免得旧方案下这条记录缺列。
    if (dataVersion === 'v09') {
      row.updated_at = p.updated_at || '';
      row.next_update = p.next_update || '';
      row.retention = { status_basis: 'AI 误写入固定人物，已改回候选', missing_evidence: '', next_observation: '' };
    }
    return row;
  }

  function markAiOutput(change) {
    if (!change || change.source !== 'unit-output') return;
    pendingAiNpcNames = new Set(listOf(window.WE_WORLD_DATA, 'npcs').map(function (item) {
      return item && item.name;
    }).filter(Boolean));
  }

  function takeAiAddedNpcs(world) {
    const before = pendingAiNpcNames;
    pendingAiNpcNames = null;
    if (!before) return [];
    const excluded = new Set(
      listOf(world, 'exclusions')
        .filter(function (item) { return item && item.kind === 'person' && item.name; })
        .map(function (item) { return item.name; }),
    );
    return listOf(world, 'npcs').filter(function (npc) {
      return npc && npc.name && !before.has(npc.name);
    }).map(function (npc) {
      return { npc: npc, excluded: excluded.has(npc.name) };
    });
  }

  function applyAiNpcMovesLocally(world, added) {
    const patches = [];
    added.forEach(function (item) {
      const name = item.npc.name;
      world.npcs = listOf(world, 'npcs').filter(function (row) { return !row || row.name !== name; });
      patches.push({ op: 'delete', table: 'bg_fixed_npc_state', primaryKey: name });
      if (item.excluded) return;
      const row = npcToCandidate(item.npc);
      world.candidates = listOf(world, 'candidates').filter(function (c) { return !c || c.name !== name; }).concat([row]);
      patches.push({ op: 'write', table: 'bg_candidate_state', primaryKey: name, values: row });
    });
    return patches;
  }

  function acceptData(result, version) {
    const world = extractWorld(result);
    dataVersion = version;
    // 先按原始形状改回候选（补丁写回的是该版本自己的表结构），再统一成 v1.0 形状给页面。
    const added = takeAiAddedNpcs(world);
    const patches = added.length ? applyAiNpcMovesLocally(world, added) : [];
    if (version === 'v09') toV10(world);
    world.__version = version;
    window.WE_WORLD_DATA = world;
    const first = !hasData;
    hasData = true;
    clearTimeout(bridgeTimer);
    status.hidden = true;
    framesRoot.hidden = false;
    if (first) sync(false);
    else broadcastRefresh();
    if (patches.length) applyPatches(patches).catch(function (err) {
      console.warn('[world-view] 将 AI 新增人物改回候选失败', err);
    });
  }

  function startBridge() {
    if (!bridgeEnabled || window.parent === window) {
      setStatus(
        '需要从异步助手橱窗打开',
        '此站点不再包含示例数据。请导入配套配置方案，然后在异步助手的“橱窗”中打开。',
      );
      return;
    }
    bridgeTimer = setTimeout(function () {
      if (!hasData) setStatus(
        '未收到后台世界数据',
        '请确认当前方案包含 ' + VIEWS.map(function (v) { return v.viewId; }).join(' / ') + ' 中的一个，且异步助手数据库桥已加载。',
      );
    }, 8000);
    VIEWS.forEach(function (v) {
      window.parent.postMessage({
        type: 'we-watch-view',
        watchId: v.watchId,
        viewId: v.viewId,
        params: {},
        options: {},
      }, '*');
    });
    window.parent.postMessage({
      type: 'we-subscribe',
      subscribeId: WATCH_ID + '-changes',
      filter: {},
    }, '*');
  }

  function parseRoute() {
    const raw = String(location.hash || '').replace(/^#\/?/, '').trim();
    const id = raw.split(/[?#]/)[0] || DEFAULT;
    return ROUTES[id] ? id : DEFAULT;
  }

  function navigate(id, opts) {
    const route = ROUTES[id] ? id : DEFAULT;
    if (opts && opts.focus != null) {
      try { sessionStorage.setItem('focusTask', String(opts.focus)); } catch (_e) { /* ignore */ }
    }
    const next = '#/' + route;
    if (location.hash === next) sync(true);
    else location.hash = next;
  }

  function frameUrl(id) {
    return new URL(ROUTES[id], location.href).href;
  }

  function ensureFrame(id) {
    if (frames[id]) return frames[id];
    const el = document.createElement('iframe');
    el.title = id;
    el.dataset.route = id;
    framesRoot.appendChild(el);
    frames[id] = el;
    return el;
  }

  function reveal(id) {
    current = id;
    Object.keys(ROUTES).forEach(function (rid) {
      const el = frames[rid];
      if (el) el.classList.toggle('is-on', rid === id);
    });
  }

  function postToFrame(id, payload) {
    const el = frames[id];
    if (!el || !el.contentWindow || el.dataset.ready !== '1') return;
    try { el.contentWindow.postMessage(payload, '*'); } catch (_e) { /* ignore */ }
  }

  function loadFrame(id, thenReveal) {
    const el = ensureFrame(id);
    if (el.dataset.ready === '1' && el.getAttribute('src')) {
      if (thenReveal) reveal(id);
      return;
    }
    if (el.getAttribute('src') && el.dataset.loading === '1') {
      if (thenReveal) el.dataset.reveal = '1';
      return;
    }
    el.dataset.loading = '1';
    if (thenReveal) el.dataset.reveal = '1';
    el.addEventListener('load', function () {
      el.dataset.ready = '1';
      el.dataset.loading = '';
      if (el.dataset.reveal === '1' && pending === id) reveal(id);
      el.dataset.reveal = '';
    }, { once: true });
    el.src = frameUrl(id);
  }

  function prefetchRest(except) {
    if (prefetchStarted) return;
    prefetchStarted = true;
    const rest = Object.keys(ROUTES).filter(function (id) { return id !== except; });
    let i = 0;
    function next() {
      if (i >= rest.length) return;
      loadFrame(rest[i++], false);
      setTimeout(next, 80);
    }
    if (typeof requestIdleCallback === 'function') {
      requestIdleCallback(next, { timeout: 600 });
    } else {
      setTimeout(next, 200);
    }
  }

  function showRoute(id) {
    pending = id;
    const el = ensureFrame(id);
    if (el.dataset.ready === '1') {
      reveal(id);
      prefetchRest(id);
      return;
    }
    loadFrame(id, true);
    prefetchRest(id);
  }

  function broadcastRefresh() {
    Object.keys(frames).forEach(function (id) {
      postToFrame(id, { type: 'we-world-refresh' });
    });
  }

  function sync(force) {
    if (!hasData) return;
    const id = parseRoute();
    showRoute(id);
    let focus = '';
    try { focus = sessionStorage.getItem('focusTask') || ''; } catch (_e) { focus = ''; }
    if (!focus) return;
    const send = function () { postToFrame(id, { type: 'we-focus', name: focus }); };
    const el = frames[id];
    if (el && el.dataset.ready === '1') send();
    else if (el) el.addEventListener('load', send, { once: true });
  }

  window.WE_SPA = { navigate: navigate, routes: ROUTES, applyPatches: applyPatches };

  let patchSeq = 0;
  const patchPending = Object.create(null);

  function applyPatches(patches) {
    return new Promise(function (resolve, reject) {
      const id = 'p' + (++patchSeq);
      patchPending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ type: 'we-apply-patches', id: id, patches: patches || [] }, '*');
      setTimeout(function () {
        if (!patchPending[id]) return;
        delete patchPending[id];
        reject(new Error('写入超时'));
      }, 20000);
    });
  }

  window.addEventListener('message', function (e) {
    const data = e && e.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'we-goto') {
      navigate(data.route, data.opts || {});
      return;
    }
    if (e.source === window.parent && data.type === 'we-apply-patches-result' && data.id && patchPending[data.id]) {
      const pending = patchPending[data.id];
      delete patchPending[data.id];
      if (data.ok) pending.resolve(data.result || { ok: true });
      else pending.reject(new Error(data.error || '写入失败'));
      return;
    }
    if (e.source === window.parent && data.type === 'we-data-changed') {
      markAiOutput(data.change);
      return;
    }
    if (e.source === window.parent && data.type === 'we-watch-view-result') {
      const view = VIEWS.find(function (v) { return v.watchId === data.watchId; });
      if (!view) return;
      // 已经在用排位更高的视图时，低版本视图的数据和错误都不理会。
      if (view.rank < dataRank) return;
      if (!data.ok) {
        if (!hasData) setStatus('读取后台世界数据失败', data.error || 'AcuData.watchView 返回错误。');
        return;
      }
      // 视图不存在时 queryView 返回 ok:false 的空结果，不当成数据。
      if (data.result && data.result.ok === false && !(data.result.data && data.result.data.background_world)) return;
      try {
        acceptData(data.result, view.shape);
        dataRank = view.rank;
      } catch (err) {
        setStatus('后台世界数据格式不匹配', String(err && err.message || err));
      }
    }
  });

  window.addEventListener('hashchange', function () { sync(false); });
  if (!location.hash) history.replaceState(null, '', '#/' + DEFAULT);
  startBridge();
})();
</script>
</body>
</html>
